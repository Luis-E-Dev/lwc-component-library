<template>
    <template if:true={isOpen}>
        <!-- Backdrop -->
        <div class={backdropClass} onclick={handleBackdropClick}></div>
        
        <!-- Modal -->
        <section class={containerClass} role="dialog" aria-modal="true">
            <div class="slds-modal__container">
                <!-- Header -->
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">{title}</h2>
                    <button class="slds-button slds-button_icon slds-modal__close" onclick={handleCancel}>
                        <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                </header>
                
                <!-- Body -->
                <div class="slds-modal__content slds-p-around_medium">
                    <slot></slot>
                </div>
                
                <!-- Footer -->
                <footer if:true={showFooter} class="slds-modal__footer">
                    <lightning-button variant="neutral" label={cancelLabel} onclick={handleCancel}></lightning-button>
                    <lightning-button variant="brand" label={confirmLabel} onclick={handleConfirm}></lightning-button>
                </footer>
            </div>
        </section>
    </template>
</template>
