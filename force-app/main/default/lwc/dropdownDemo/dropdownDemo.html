<template>
    <lightning-card title="Dropdown Demo">
        <div class="slds-p-around_medium">
            <div class="slds-grid slds-gutters slds-wrap">
                <c-custom-dropdown label="Actions"
                    icon-name="utility:down" 
                    menu-items={menuItems1} 
                    onitemselected={handleItemSelected} 
                    has-icon
                    variant="border-filled">
                </c-custom-dropdown>
                <c-custom-dropdown label="More Actions"
                   icon-name="utility:down"
                   menu-alignment="right"
                   menu-items={menuItems2}
                   onitemselected={handleItemSelected}
                   has-icon
                   variant="border-filled">
                </c-custom-dropdown>
                <c-custom-dropdown label="No Icon Dropdown"
                    icon-name="utility:down"
                    menu-items={menuItems3} 
                    onitemselected={handleItemSelected}
                    variant="border-filled">
                </c-custom-dropdown>
            </div>
        </div>
    </lightning-card>
</template>
